# Example nginx server block for fronting the sms_forwarder backend with
# TLS, per docs/specs/0008-security-and-ops.md assumption 4. This is a
# reference for manual setup on the operator's existing nginx (e.g. via
# 3x-ui) - it is not applied automatically and not covered by any test.
#
# Adjust server_name and ssl_certificate paths to match the actual
# domain/certificate (e.g. issued by certbot/Let's Encrypt).

server {
    listen 443 ssl;
    server_name sms-forwarder.example.com;

    ssl_certificate     /etc/letsencrypt/live/sms-forwarder.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sms-forwarder.example.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # GET /events streams Server-Sent Events - disable proxy buffering
        # so messages reach the client without delay.
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}

server {
    listen 80;
    server_name sms-forwarder.example.com;
    return 301 https://$host$request_uri;
}
